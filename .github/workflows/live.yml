# The page audit (Qa.ts) against the live pages: after every deploy (./ci.sh live) and once a day on its own.
name: live
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs
        default: https://captions.smaverk.com/ https://vertical.smaverk.com/ https://smaverk.com/
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: captions/app
    env:
      URLS: ${{ inputs.urls || 'https://captions.smaverk.com/ https://vertical.smaverk.com/ https://smaverk.com/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Audit
        run: |
          cp "$GITHUB_WORKSPACE/_tools/Qa.ts" ./Qa.ci.ts
          fail=0
          for u in $URLS; do
            host=$(echo "$u" | sed -E 's#https?://([^/]+).*#\1#')
            echo "== $u"
            bun Qa.ci.ts "$u" --out "$GITHUB_WORKSPACE/.qa/$host" || fail=1
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: .qa
          include-hidden-files: true
          retention-days: 14
