# Rebuilds the sample on the clip finder's page with the tool that is on the page, on a runner.
#
# The page's claim about its sample is that the moments ARE this tool's output (tools/sample.ts says so in
# its header), so the sample has to be rebuilt whenever the ranker changes, or the page is showing output
# its own tool would no longer return. Reading a 65-minute recording costs about 0.4x real time — half an
# hour of CPU — which is why it runs here and not on the laptop, and why it is dispatch-only: it must never
# be attached to a push.
#
# It downloads the recording named in clipfinder/app/SOURCES.md (NASA, public domain), runs the same three
# steps the page runs, and uploads dist/sample.json and dist/sample.m4a. Whoever dispatched it fetches the
# artifacts and commits them; nothing here writes to the repository.
name: clipfinder-sample

on:
  workflow_dispatch:
    inputs:
      mp3:
        description: 'Recording to read. The default is the episode in clipfinder/app/SOURCES.md.'
        default: 'https://traffic.megaphone.fm/NATIONALAERONAUTICSANDSPACEADMINISTRATION8653428112.mp3?updated=1774531589'
      title:
        description: 'Shown beside the sample on the page.'
        default: 'Artemis II: The Crew, 65 min'
      credit:
        description: 'Who made the recording, and under what.'
        default: 'NASA, Houston We Have a Podcast, 27 March 2026 — public domain'
      url:
        description: 'Where a visitor can go and hear the whole thing.'
        default: 'https://www.nasa.gov/podcasts/houston-we-have-a-podcast/'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    # The read is ~26 minutes for this episode and the model download is the other variable. Well above the
    # estimate on purpose: a job killed at its limit uploads nothing, and the work is only worth having if
    # it reaches the artifact store.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: clipfinder/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - run: bun install --frozen-lockfile
      - name: The recording
        env:
          MP3: ${{ inputs.mp3 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 900 -o recording.mp3 "$MP3"
          # Trust nothing that came off the network: a CDN error page is also a 200 with bytes in it.
          bytes=$(stat -c%s recording.mp3)
          [ "$bytes" -gt 5000000 ] || { echo "::error::recording is only $bytes bytes — that is not an hour of audio"; head -c 400 recording.mp3; exit 1; }
          secs=$(ffprobe -v error -show_entries format=duration -of csv=p=0 recording.mp3 | cut -d. -f1)
          echo "$bytes bytes, ${secs}s"
          [ "$secs" -gt 600 ] || { echo "::error::decoded duration is ${secs}s — the wrong file, or a truncated one"; exit 1; }
      - name: Read it, and find the moments
        env:
          TITLE: ${{ inputs.title }}
          CREDIT: ${{ inputs.credit }}
          URL: ${{ inputs.url }}
        run: bun tools/sample.ts --mp3 recording.mp3 --title "$TITLE" --credit "$CREDIT" --url "$URL"
      - name: What came out
        run: |
          set -euo pipefail
          ls -l dist/sample.json dist/sample.m4a
          bun -e 'const s=JSON.parse(await Bun.file("dist/sample.json").text());
            console.log(`${s.durationS}s · ${s.words} words · ${s.silences} silences · read ${s.readTimesRealTime}x`);
            for (const [k,v] of Object.entries(s.sets)) console.log(`${k}s → ${v.length}: ` + v.map(m=>`${Math.round(m.startS)}-${Math.round(m.endS)}`).join(", "));
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipfinder-sample
          path: |
            clipfinder/app/dist/sample.json
            clipfinder/app/dist/sample.m4a
            clipfinder/app/.sample-read.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
