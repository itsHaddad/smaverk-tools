# The browser gates of every tool, off the laptop. deploy.sh refuses to deploy a commit whose run here is not green.
name: gates
on:
  push:
    branches: [main]
    paths: ["captions/app/**", "vertical/app/**", "_tools/**", "tests/**", ".github/workflows/gates.yml"]
  workflow_dispatch:
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  site:
    # The ripple check: wording, legal links, outside hosts, prices and limits agree across every page. No browser.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun test tests/site.test.ts
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: captions
            product: tests/e2e/verify-speed.mjs
          - app: vertical
            product: tests/e2e/verify-clip.mjs
    defaults:
      run:
        working-directory: ${{ matrix.app }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Machine
        run: echo "$(nproc) cores, $(free -m | awk '/Mem:/{print $2}') MB"
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Shared audit tools where the gates look for them
        run: mkdir -p "$HOME/.claude/skills/Missions/Tools" && cp "$GITHUB_WORKSPACE"/_tools/* "$HOME/.claude/skills/Missions/Tools/"
      - run: bun install --frozen-lockfile
      - name: Chromium
        run: bunx playwright install --with-deps chromium
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Smoke
        run: bun tests/smoke.mjs
      - name: Product gate
        run: bun ${{ matrix.product }}
      - name: Phone UI gate
        run: bun tests/e2e/verify-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-out
          path: ${{ matrix.app }}/app/tests/e2e/out
          if-no-files-found: ignore
          retention-days: 7
